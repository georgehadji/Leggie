[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leggie"
version = "0.1.0"
description = "Deterministic legal-analysis workflow for Greek legislation — Clean Architecture, event-sourced, LLM-powered"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Leggie Contributors" },
]

dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "structlog>=24.0",
    "httpx>=0.27",
    "asyncio",
    "pyyaml>=6.0",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "aiofiles>=24.0",
]

[project.scripts]
leggie = "leggie.interfaces.cli:entry_point"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-benchmark>=4.0",
    "hypothesis>=6.0",
    "coverage>=7.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.0",
]
lint = [
    "import-linter>=2.0",
    "ruff>=0.5",
    "mypy>=1.10",
]
eval = [
    "pandas>=2.0",
    "scikit-learn>=1.5",
    "matplotlib>=3.8",
]

[tool.ruff]
target-version = "py312"
line-length = 100
indent-width = 4

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG", "C4", "PIE", "RET"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
strict = true
python_version = "3.12"
disable_error_code = ["import-untyped"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py", "*_test.py"]

[tool.coverage.run]
source = ["leggie"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.import-linter]
root_package = "leggie"
include_external_dependencies = false

[[tool.import-linter.contract_types]]
name = "layer_dependencies"
type = "layers"
containers = [
    "leggie.domain",
    "leggie.application",
    "leggie.infrastructure",
    "leggie.interfaces",
    "leggie.config",
]
layers = [
    "leggie.interfaces",
    "leggie.infrastructure",
    "leggie.application",
    "leggie.domain",
    "leggie.config",
]
depend_inside = true
forbidden_imports = [
    {importer = "leggie.interfaces", import = "leggie.infrastructure"},
    {importer = "leggie.interfaces", import = "leggie.domain"},
    {importer = "leggie.infrastructure", import = "leggie.interfaces"},
    {importer = "leggie.application", import = "leggie.infrastructure"},
    {importer = "leggie.domain", import = "leggie.application"},
    {importer = "leggie.domain", import = "leggie.infrastructure"},
    {importer = "leggie.domain", import = "leggie.interfaces"},
    {importer = "leggie.config", import = "leggie.domain"},
    {importer = "leggie.config", import = "leggie.application"},
    {importer = "leggie.config", import = "leggie.infrastructure"},
    {importer = "leggie.config", import = "leggie.interfaces"},
]
