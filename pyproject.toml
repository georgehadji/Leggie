[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leggie"
version = "0.1.0"
description = "Deterministic legal-analysis workflow for Greek legislation — Clean Architecture, event-sourced, LLM-powered"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Leggie Contributors" },
]

dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "structlog>=24.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "aiofiles>=24.0",
]

[project.scripts]
leggie = "leggie.interfaces.cli:entry_point"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-benchmark>=4.0",
    "hypothesis>=6.0",
    "coverage>=7.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.0",
    "types-PyYAML>=6.0",
]
lint = [
    "import-linter>=2.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "bandit>=1.7",
]
eval = [
    "pandas>=2.0",
    "scikit-learn>=1.5",
    "matplotlib>=3.8",
]

[tool.ruff]
target-version = "py312"
line-length = 100
indent-width = 4

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG", "C4", "PIE", "RET"]
# Frozen debt — never widened to silence a new failure (change-control rule 5).
# Drained 2026-08-08: B904 (4), B017 (6), B027 (3), E741 (2), SIM102 (2) were
# real defects and are fixed, not ignored. F821/F401/I001 went earlier.
# The two survivors are style, not bug classes, and are kept deliberately:
#   E501  (163) line length — the codebase wraps at ~100 by hand; enforcing 88
#         would reflow Greek-language docstrings and comments for no defect win.
#   ARG002 (85) unused method argument — overwhelmingly port/ABC implementations
#         that must accept the interface's parameters they do not need.
# Both are candidates for a later, separate pass; neither hides a bug today.
ignore = ["E501", "ARG002"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
strict = true
python_version = "3.12"

# tests/ is type-checked (v1.0 exit criterion), but two strictness knobs are
# relaxed for it. `strict` demands a return annotation on every function; for
# ~700 pytest cases that means adding `-> None` 700 times, which buys no type
# safety and hides the errors that matter. Everything else stays on: bad
# argument types, wrong attribute access, and unreachable code in tests are
# still errors. Do not add further relaxations here.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.bandit]
exclude_dirs = ["tests", ".reasonix", "graphify-out"]
# `disable_error_code` was here — a mypy option in bandit's table, so bandit
# ignored it and mypy never saw it. Removed rather than relocated: mypy leggie/
# is clean without it.

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py", "*_test.py"]

[tool.coverage.run]
source = ["leggie"]
branch = true

[tool.coverage.report]
# Single source of truth for the coverage gate. CI must NOT pass
# --cov-fail-under, which silently overrides this file: it carried 80 while
# this line said 85, so the advertised gate was never the enforced one.
# 82 is the measured floor as of 2026-08-08 — a ratchet, not a target. The
# v1.0 exit criterion is 85 overall (plus 90 for infrastructure/llm/ and
# application/agents/); raise this line as coverage earns it.
fail_under = 82
show_missing = true

[tool.importlinter]
root_packages = ["leggie"]

[[tool.importlinter.contracts]]
name = "layer-dependencies"
type = "layers"
layers = [
    "leggie.interfaces",
    "leggie.infrastructure",
    "leggie.application",
    "leggie.domain",
    "leggie.observability",
    "leggie.config",
]
# ARCH-01 (2026-08-05): namespace packages under application/{agents,cqrs,services,
# workflow} and infrastructure/llm/adapters lacked __init__.py, so grimp's module
# graph silently omitted them (74 of 118 modules seen) and this contract passed
# vacuously over every violation below. __init__.py added; contract now sees the
# real graph. Entries below are the itemized violation set captured at that
# moment — each is removed by the phase named in its comment, not left standing.
# unmatched_ignore_imports_alerting defaults to "error", so a stale entry (import
# already fixed) fails the contract until pruned — the baseline cannot silently rot.
#
# ARCH-03 (2026-08-05, Phase 1): observability relocated from
# leggie.infrastructure.observability to leggie.observability, declared as its
# own layer below domain — it only ever imported leggie.config, so it was never
# real infrastructure, just filed in the wrong package. All 14 of that group's
# entries are gone: they're legal downward dependencies now, not ignored ones.
ignore_imports = [
    # ARCH-04 — removed by Phase 2 (composition-root construction moved to container.py)
    # IMPL-1 Group A (2026-08-10): citation/ingest/reasoner.adapter drained —
    # cli_handlers now resolves CitationParserPort/IngestPort/ParsePort/ReasonerPort
    # from the container instead of hand-constructing adapters. Also fixed D22
    # (deliberative path was constructing an unindexed citation parser).
    # IMPL-1 Group C: the TYPE_CHECKING import of Container itself is gone too —
    # cli_handlers.py now type-hints against a local ContainerProtocol (get/
    # has_binding only), mirroring DeliberativeFlow's ServerLifecycle Protocol.
    # This line is gone.
    # Group A deferred this one: ParseDocumentHandler still imports DocumentParser
    # directly for extract_citations(), which has no ParsePort/CitationParserPort
    # equivalent — it uses different regexes/output shape than GreekCitationParser.
    # See ARCHITECTURE_IMPLEMENTATION_PLAN_2026-08-10.md §2.1 Group A footnote.
    "leggie.application.cqrs.handlers.cli_handlers -> leggie.infrastructure.parse",
    # IMPL-1 Group C (2026-08-10): LLMError/LLMConfigurationError/LLMTimeoutError/
    # LLMRateLimitError/BudgetExceededError moved to application/ports/llm.py —
    # callers across layer boundaries are expected to catch them, which makes
    # them the port's contract, not infra's (mirrors ReasonerUnavailableError's
    # existing home in application/ports/reasoner.py). BaseLLMProvider stayed in
    # infrastructure/llm/base.py; it has no cross-layer callers. This line is gone.
    # IMPL-1 Group B (2026-08-10) reassessed these as permanent, not debt: the
    # plan proposed a string-key container binding, but CheckpointStore(path)/
    # GoldSet(path)/EvalScorer(gold_set) all take a per-request runtime value
    # (--checkpoint-path, gold_set_path) that a zero-arg container factory
    # cannot supply. A string key wouldn't remove the import — cli_handlers
    # still has to construct the class directly either way. Same reasoning
    # applies to bill_analysis_flow's checkpoint_store: run(checkpoint_path=...)
    # constructs one when the caller didn't inject one.
    "leggie.application.cqrs.handlers.cli_handlers -> leggie.infrastructure.persistence.checkpoint_store",
    "leggie.application.cqrs.handlers.cli_handlers -> leggie.infrastructure.persistence.eval_harness",
    "leggie.application.cqrs.handlers.cli_handlers -> leggie.infrastructure.reasoner.server_manager",
    "leggie.application.workflow.bill_analysis_flow -> leggie.infrastructure.persistence.checkpoint_store",
    # ingest_parse.py's lazy-fallback factories mirror container.py's own
    # IngestPort/ParsePort bindings exactly (verified 2026-08-10: both are
    # one-line passthroughs to IngestAdapter()/ParseAdapter()). Deleting the
    # file requires making BillAnalysisFlow/DeliberativeFlow's ingester/parser
    # params non-optional, which touches ~57 test construction sites across
    # 3 files that rely on the default today — deferred to its own phase.
    "leggie.application.workflow.ingest_parse -> leggie.infrastructure.ingest_adapter",
    "leggie.application.workflow.ingest_parse -> leggie.infrastructure.parse_adapter",
]

[[tool.importlinter.contracts]]
name = "domain-purity"
type = "forbidden"
source_modules = ["leggie.domain"]
forbidden_modules = [
    "leggie.interfaces",
    "leggie.infrastructure",
    "leggie.application",
    # The layers contract permits domain -> observability (observability sits
    # below domain in the layer order); this contract forbids it explicitly,
    # since a domain model has no legitimate reason to log anything itself.
    "leggie.observability",
]
