name: Leggie CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 6 * * 1"  # Weekly audit Monday 06:00

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install dependencies
        run: |
          pip install -e ".[dev,lint]"

      - name: Lint with ruff
        run: ruff check leggie/ tests/

      - name: Type check with mypy
        run: mypy leggie/ --ignore-missing-imports

      - name: Enforce architecture with import-linter
        # ARCH-02: normal-mode rendering crashes with "Only one live display
        # may be active at once" on some platforms; --debug propagates
        # exceptions instead of swallowing them for pretty-print, which is
        # strictly safer for CI and does not change pass/fail semantics.
        run: lint-imports --debug

      - name: Security scan with bandit
        run: bandit -c pyproject.toml -r leggie/

      - name: Audit dependencies
        run: |
          pip install pip-audit
          pip-audit --strict --desc on

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install dependencies
        run: |
          pip install -e ".[dev,lint]"

      - name: Run tests with coverage gate
        run: |
          pytest tests/ -v --tb=short --cov=leggie --cov-fail-under=80
