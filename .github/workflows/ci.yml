name: Leggie CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Supersede in-flight runs for the same ref so a rapid series of pushes bills
# one run, not one per push. Master is exempt: its runs always finish, so the
# default branch never loses a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          pip install -e ".[dev,lint]"

      - name: Check formatting with ruff
        run: |
          ruff format --check leggie/ tests/ scripts/

      - name: Lint with ruff
        run: |
          ruff check leggie/ tests/ scripts/

      - name: Type check with mypy
        run: |
          mypy leggie/ --ignore-missing-imports

      - name: Enforce architecture with import-linter
        run: |
          lint-imports

      - name: Run security scan with bandit
        run: |
          bandit -c pyproject.toml -r leggie/

      - name: Run tests with coverage gate
        run: |
          pytest tests/ -v --tb=short --cov=leggie --cov-fail-under=80
