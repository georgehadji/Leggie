name: Leggie CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e ".[dev,lint]"

      - name: Lint with ruff
        run: |
          ruff check leggie/ tests/

      - name: Type check with mypy
        run: |
          mypy leggie/ --ignore-missing-imports

      - name: Enforce architecture with import-linter
        # ARCH-02: normal-mode rendering crashes with "Only one live display
        # may be active at once" on some platforms; --debug propagates
        # exceptions instead of swallowing them for pretty-print, which is
        # strictly safer for CI and does not change pass/fail semantics.
        run: |
          lint-imports --debug

      - name: Run security scan with bandit
        run: |
          bandit -c pyproject.toml -r leggie/

      - name: Run tests with coverage gate
        run: |
          pytest tests/ -v --tb=short --cov=leggie --cov-fail-under=80
