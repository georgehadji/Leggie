# Leggie verifies locally. GitHub Actions has not executed a job for this
# repository since 2026-07-15 (see docs/CI_OUTAGE_2026-07.md), so these hooks
# and scripts/run_gates.py ARE the gate — not a green tick on a PR.
#
# Install once (wires both pre-commit and pre-push):
#     pre-commit install
#
# Every hook below runs the project's own installed tools through
# scripts/run_gates.py, so pre-commit, run_gates.py and .github/workflows/ci.yml
# cannot drift apart, and verification needs no network. Requires the dev extras:
#     pip install -e ".[dev,lint]"

default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      # ── On every commit: fast gates ──────────────────────────────────
      - id: ruff-fix
        name: "ruff --fix (autofix touched files)"
        entry: python -m ruff check --fix --unsafe-fixes
        language: system
        types_or: [python, pyi]

      # NOTE: `ruff format` is deliberately NOT a hook. .github/workflows/ci.yml
      # has no format step, so formatting has never been a gate here, and the
      # tree is currently ~85 files away from ruff-format-clean. Adopting it is
      # a worthwhile change, but it is a repo-wide reformat that belongs in its
      # own commit — not silently attached to every commit from now on.

      - id: gate-ruff
        name: "gate: ruff (whole tree, as CI runs it)"
        entry: python scripts/run_gates.py ruff
        language: system
        pass_filenames: false
        always_run: true

      - id: gate-mypy
        name: "gate: mypy strict"
        entry: python scripts/run_gates.py mypy
        language: system
        pass_filenames: false
        always_run: true

      - id: gate-bandit
        name: "gate: bandit security scan"
        entry: python scripts/run_gates.py bandit
        language: system
        pass_filenames: false
        always_run: true

      # ── Before code leaves the machine: the slower gates ─────────────
      # These are the ones a dead CI used to be the safety net for.
      - id: gate-import-linter
        name: "gate: import-linter (layer contract)"
        entry: python scripts/run_gates.py import-linter
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: gate-pytest
        name: "gate: pytest + 80% coverage floor"
        entry: python scripts/run_gates.py pytest
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
