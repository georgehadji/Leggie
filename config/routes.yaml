# Leggie Route Rules — static YAML routing table
# Maps task_type → {model, tier, max_tokens, cascade_models}
#
# Models use OpenRouter IDs (openrouter.ai).
# Variants: :thinking (chain-of-thought), :free (free tier), :extended (large context)
# Cascade: on low confidence / failure, escalates FREE → BUDGET → PREMIUM

routes:
  # ── Core analysis tasks ──────────────────────────────────────────
  lens_analysis:
    model: "openai/gpt-5.6-luna:thinking"
    tier: "budget"
    max_tokens: 4096
    cascade: true
    cascade_models:
      free: "google/gemini-2.5-flash:free"
      budget: "openai/gpt-5.6-luna:thinking"
      premium: "openai/gpt-5.6-luna-pro:thinking"

  verbalized_sampling:
    model: "openai/gpt-5.6-luna"
    tier: "budget"
    max_tokens: 8192
    cascade: true
    cascade_models:
      budget: "openai/gpt-5.6-luna"
      premium: "openai/gpt-5.6-luna-pro"

  adversarial_critic:
    model: "google/gemini-2.5-flash"
    tier: "free"
    max_tokens: 2048
    cascade: true
    cascade_models:
      free: "google/gemini-2.5-flash:free"
      budget: "openai/gpt-5.6-terra"

  # ── Simple / cheap tasks ─────────────────────────────────────────
  classification:
    model: "google/gemini-2.5-flash:free"
    tier: "free"
    max_tokens: 1024
    cascade: true
    cascade_models:
      free: "google/gemini-2.5-flash:free"
      budget: "openai/gpt-5.6-terra"

  summarization:
    model: "google/gemini-2.5-flash:free"
    tier: "free"
    max_tokens: 2048
    cascade: false
    cascade_models:
      free: "google/gemini-2.5-flash:free"
      budget: "openai/gpt-5.6-luna"
      premium: "openai/gpt-5.6-luna-pro"

  # ── Quality-critical tasks ───────────────────────────────────────
  evidence_verification:
    model: "openai/gpt-5.6-terra-pro:thinking"
    tier: "premium"
    max_tokens: 2048
    cascade: true
    cascade_models:
      premium: "openai/gpt-5.6-terra-pro:thinking"

  report_generation:
    model: "openai/gpt-5.6-luna:extended"
    tier: "budget"
    max_tokens: 8192
    cascade: true
    cascade_models:
      budget: "openai/gpt-5.6-luna:extended"
      premium: "openai/gpt-5.6-luna-pro:extended"
