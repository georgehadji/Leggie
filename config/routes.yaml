# Leggie Route Rules — static YAML routing table
# Maps task_type → {model, tier, max_tokens, cascade_models}
#
# Models use REAL OpenRouter IDs (verified on openrouter.ai/api/v1/models).
# VFM tiering per docs/FIX_PLAN §Model VFM: Greek-competent + cost-optimal.
# Cascade: on low confidence / failure, escalates FREE → BUDGET → PREMIUM.
#
# Tier defaults:
#   FREE/cheap    google/gemini-2.5-flash-lite   (~$0.10/1M in)
#   BUDGET/work   google/gemini-2.5-flash        (~$0.30/1M in)  — proven Greek-capable workhorse
#   PREMIUM       google/gemini-2.5-pro          (~$1.25/1M in)  — long-context Greek quality

routes:
  # ── Core analysis (cost driver: 5 lenses × N articles) ───────────
  lens_analysis:
    model: "google/gemini-2.5-flash"
    tier: "budget"
    max_tokens: 6144
    cascade: true
    cascade_models:
      free: "google/gemini-2.5-flash-lite"
      budget: "google/gemini-2.5-flash"
      premium: "google/gemini-2.5-pro"

  verbalized_sampling:
    model: "google/gemini-2.5-flash"
    tier: "budget"
    max_tokens: 8192
    cascade: true
    cascade_models:
      budget: "google/gemini-2.5-flash"
      premium: "google/gemini-2.5-pro"

  # Skeptic must CATCH legal errors the lens missed.
  # Placed on the premium tier so the critic is strictly stronger than the
  # lens model (google/gemini-2.5-flash) that produced the finding.
  adversarial_critic:
    model: "google/gemini-2.5-pro"
    tier: "premium"
    max_tokens: 2048
    cascade: true
    cascade_models:
      premium: "google/gemini-2.5-pro"

  # ── Simple / cheap tasks ─────────────────────────────────────────
  classification:
    model: "google/gemini-2.5-flash-lite"
    tier: "free"
    max_tokens: 1024
    cascade: true
    cascade_models:
      free: "google/gemini-2.5-flash-lite"
      budget: "google/gemini-2.5-flash"

  summarization:
    model: "google/gemini-2.5-flash-lite"
    tier: "free"
    max_tokens: 2048
    cascade: false
    cascade_models:
      free: "google/gemini-2.5-flash-lite"
      budget: "google/gemini-2.5-flash"
      premium: "google/gemini-2.5-pro"

  # ── Quality-critical (low volume: survivors / final reports) ─────
  evidence_verification:
    model: "google/gemini-2.5-pro"
    tier: "premium"
    max_tokens: 2048
    cascade: true
    cascade_models:
      premium: "google/gemini-2.5-pro"

  report_generation:
    model: "google/gemini-2.5-pro"
    tier: "premium"
    max_tokens: 8192
    cascade: true
    cascade_models:
      budget: "google/gemini-2.5-flash"
      premium: "google/gemini-2.5-pro"
